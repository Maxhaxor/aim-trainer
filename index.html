<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim Trainer — loading…</title>
<style>body{margin:0;background:#0b0f1c;color:#ffd9a8;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div id="s">Loading aim trainer…</div>
<script type="module">
const N = 8;
const parts = [];
for (let i = 0; i < N; i++) {
  const m = await import('./c' + i + '.js');
  parts.push(m.default);
}
const b64 = parts.join('');
const bin = atob(b64);
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
const html = new TextDecoder().decode(bytes);
document.open();
document.write(html);
document.close();
</script>
</body>
</html>
