<style>

<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const menu=document.getElementById('menu');
const back=document.getElementById('back');
const fpsEl=document.getElementById('fps');
const spdEl=document.getElementById('spd');
const accEl=document.getElementById('acc');
const wpnEl=document.getElementById('wpn');
const modeEl=document.getElementById('modeLabel');
const killEl=document.getElementById('kill');
const scopeEl=document.getElementById('scope');
const flashEl=document.getElementById('flash');
const crossEl=document.getElementById('cross');
const W=1200,H=750;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a2838);scene.fog=new THREE.FogExp2(0x1a2838,0.012);
const camera=new THREE.PerspectiveCamera(75,W/H,0.05,400);const clock=new THREE.Clock();
const skyGeo=new THREE.SphereGeometry(300,32,16);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{top:{value:new THREE.Color(0x1a3048)},bot:{value:new THREE.Color(0xc47840)},mid:{value:new THREE.Color(0x6a4a5a)}},vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform vec3 top,bot,mid;varying vec3 vP;void main(){float h=normalize(vP).y;vec3 c=mix(bot,mid,smoothstep(-0.2,0.15,h));c=mix(c,top,smoothstep(0.1,0.7,h));gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(skyGeo,skyMat));
const sun=new THREE.DirectionalLight(0xffd4a0,1.6);sun.position.set(40,55,25);sun.castShadow=true;

scene.add(sun);scene.add(new THREE.AmbientLight(0x506070,0.45));scene.add(new THREE.HemisphereLight(0x88aacc,0x443322,0.35));
const gMat=new THREE.MeshStandardMaterial({color:0x5a6a48,roughness:0.92,metalness:0.05});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,250),gMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(200,50,0x3a4a30,0x3a4a30);grid.position.y=0.02;grid.material.opacity=0.35;grid.material.transparent=true;scene.add(grid);
const wood=new THREE.MeshStandardMaterial({color:0x8b6f4e,roughness:0.85,metalness:0.05});
const darkWood=new THREE.MeshStandardMaterial({color:0x5c4a35,roughness:0.9});
const concrete=new THREE.MeshStandardMaterial({color:0x7a7a72,roughness:0.95});
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
for(let i=0;i<22;i++){const s=1.1+Math.random()*1.8,h=0.9+Math.random()*2.2;box(s,h,s,Math.random()>0.5?wood:darkWood,(Math.random()-0.5)*60,h/2,(Math.random()-0.5)*60);}
box(30,2.2,0.6,concrete,0,1.1,-25);box(0.6,2.2,20,concrete,-18,1.1,-10);box(0.6,2.2,16,concrete,18,1.1,-8);

for(const [x,z] of [[-12,-15],[12,-15],[-12,5],[12,5],[-20,-5],[20,-5]])box(1.2,4.5,1.2,concrete,x,2.25,z);
function makeAWP(){const g=new THREE.Group();const dark=new THREE.MeshStandardMaterial({color:0x1e2418,roughness:0.55,metalness:0.35});const metal=new THREE.MeshStandardMaterial({color:0x3a4035,roughness:0.4,metalness:0.6});const black=new THREE.MeshStandardMaterial({color:0x0e100c,roughness:0.5,metalness:0.3});
const recv=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.13,0.09),dark);recv.position.set(0.08,-0.01,0);g.add(recv);
const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.022,1.05,10),metal);bar.rotation.z=Math.PI/2;bar.position.set(0.62,0.01,0);g.add(bar);
const muz=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.025,0.08,8),black);muz.rotation.z=Math.PI/2;muz.position.set(1.12,0.01,0);g.add(muz);
const stock=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.11,0.07),dark);stock.position.set(-0.28,-0.03,0);g.add(stock);
const stockEnd=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.14,0.08),black);stockEnd.position.set(-0.44,-0.02,0);g.add(stockEnd);
const grip=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.14,0.05),dark);grip.position.set(-0.02,-0.12,0);grip.rotation.z=0.25;g.add(grip);
const sc=new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.038,0.32,12),black);sc.rotation.z=Math.PI/2;sc.position.set(0.18,0.1,0);g.add(sc);
const r1=new THREE.Mesh(new THREE.TorusGeometry(0.042,0.008,8,16),metal);r1.rotation.y=Math.PI/2;r1.position.set(0.08,0.1,0);g.add(r1);
const r2=r1.clone();r2.position.set(0.28,0.1,0);g.add(r2);
const lens=new THREE.Mesh(new THREE.CircleGeometry(0.032,16),new THREE.MeshStandardMaterial({color:0x1a3040,metalness:0.9,roughness:0.1,emissive:0x0a1520,emissiveIntensity:0.3}));lens.position.set(0.34,0.1,0);lens.rotation.y=Math.PI/2;g.add(lens);
const bip=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.08,0.02),metal);bip.position.set(0.35,-0.08,0);g.add(bip);
g.position.set(0.32,-0.24,-0.62);g.rotation.y=0.04;g.scale.set(1.05,1.05,1.05);return g;}
const awp=makeAWP();camera.add(awp);scene.add(camera);
function makeKnife(){const g=new THREE.Group();const blade=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.32,0.008),new THREE.MeshStandardMaterial({color:0xc8d0d8,metalness:0.85,roughness:0.2}));blade.position.set(0,0.14,0);g.add(blade);
const handle=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.13,0.028),new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.7}));handle.position.set(0,-0.06,0);g.add(handle);
const guard=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.02,0.04),new THREE.MeshStandardMaterial({color:0x888888,metalness:0.7}));guard.position.set(0,0.02,0);g.add(guard);

const knife=makeKnife();camera.add(knife);
const GRAVITY=24,JUMP_V=8.5,MOVE=7.8,ACCEL=22,FRICTION=7.5,AIR_ACCEL=14;
let px=0,py=1.7,pz=10,vx=0,vy=0,vz=0,onGround=true,yaw=0,pitch=0,gameActive=false,mode=null,third=false,weapon='awp',scoped=false,hits=0,shots=0;
const keys={w:0,a:0,s:0,d:0,space:0};
const targets=[];const tMat=new THREE.MeshStandardMaterial({color:0xe74c3c,emissive:0x5a1010,emissiveIntensity:0.5,roughness:0.4});
function spawnTarget(){const t=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.85,0.12),tMat.clone());t.position.set((Math.random()-0.5)*36,1.1+Math.random()*2.2,(Math.random()-0.5)*30-12);t.castShadow=true;scene.add(t);targets.push(t);}
function clearTargets(){targets.forEach(t=>scene.remove(t));targets.length=0;}
const orb=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,20),new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x0e7490,emissiveIntensity:0.7,roughness:0.3}));orb.castShadow=true;orb.visible=false;scene.add(orb);let trackT=0;
const raycaster=new THREE.Raycaster();const tracers=[];
function shoot(){if(!gameActive)return;shots++;flashEl.style.opacity='1';setTimeout(()=>flashEl.style.opacity='0',50);
const origin=new THREE.Vector3();camera.getWorldPosition(origin);const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);const end=origin.clone().add(dir.multiplyScalar(80));
const trGeo=new THREE.BufferGeometry().setFromPoints([origin,end]);const tr=new THREE.Line(trGeo,new THREE.LineBasicMaterial({color:0xffcc66,transparent:true,opacity:0.7}));scene.add(tr);tracers.push({mesh:tr,life:0.08});
raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hs=raycaster.intersectObjects(targets,false);
if(hs.length){const hit=hs[0].object;scene.remove(hit);const i=targets.indexOf(hit);if(i>=0)targets.splice(i,1);hits++;addKill('You','target');spawnTarget();}updateAcc();}
function addKill(a,b){const d=document.createElement('div');d.textContent=a+' → '+b;killEl.prepend(d);setTimeout(()=>d.remove(),3200);while(killEl.children.length>5)killEl.lastChild.remove();}
function updateAcc(){const a=shots?Math.round(100*hits/shots):0;accEl.textContent=shots?(a+'%  '+hits+'/'+shots):'–';}
function setWeapon(w){weapon=w;wpnEl.textContent=w.toUpperCase();awp.visible=w==='awp'&&!third;knife.visible=w==='knife'&&!third;if(w==='knife'){scoped=false;scopeEl.classList.remove('on');camera.fov=75;camera.updateProjectionMatrix();crossEl.style.opacity='1';}}
document.addEventListener('keydown',e=>{if(e.code==='KeyW')keys.w=1;if(e.code==='KeyA')keys.a=1;if(e.code==='KeyS')keys.s=1;if(e.code==='KeyD')keys.d=1;if(e.code==='Space'){keys.space=1;e.preventDefault();}if(e.code==='Digit1')setWeapon('awp');if(e.code==='Digit2')setWeapon('knife');if(e.code==='KeyT'&&!e.repeat){third=!third;setWeapon(weapon);}if(e.code==='Escape')showMenu();});
document.addEventListener('keyup',e=>{if(e.code==='KeyW')keys.w=0;if(e.code==='KeyA')keys.a=0;if(e.code==='KeyS')keys.s=0;if(e.code==='KeyD')keys.d=0;if(e.code==='Space')keys.space=0;});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;const sens=scoped?0.0009:0.002;yaw-=e.movementX*sens;pitch-=e.movementY*sens;pitch=Math.max(-1.4,Math.min(1.4,pitch));});
canvas.addEventListener('mousedown',e=>{if(!gameActive)return;if(document.pointerLockElement!==canvas){canvas.requestPointerLock();return;}if(e.button===0)shoot();if(e.button===2&&weapon==='awp'){scoped=!scoped;camera.fov=scoped?28:75;camera.updateProjectionMatrix();scopeEl.classList.toggle('on',scoped);crossEl.style.opacity=scoped?'0':'1';}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function startMode(m){mode=m;gameActive=true;menu.classList.add('hidden');back.classList.add('visible');modeEl.textContent=m.toUpperCase();hits=shots=0;updateAcc();clearTargets();if(m==='squares'){for(let i=0;i<7;i++)spawnTarget();orb.visible=false;}else{orb.visible=true;trackT=0;}px=0;py=1.7;pz=12;vx=vy=vz=0;yaw=0;pitch=0;setWeapon('awp');canvas.requestPointerLock().catch(()=>{});}
function showMenu(){gameActive=false;mode=null;menu.classList.remove('hidden');back.classList.remove('visible');modeEl.textContent='';clearTargets();orb.visible=false;scoped=false;scopeEl.classList.remove('on');camera.fov=75;camera.updateProjectionMatrix();crossEl.style.opacity='1';if(document.pointerLockElement)document.exitPointerLock();}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>startMode(c.dataset.m)));back.addEventListener('click',e=>{e.stopPropagation();showMenu();});
let frames=0,ft=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);frames++;ft+=dt;if(ft>=0.4){fpsEl.textContent='FPS '+Math.round(frames/ft);frames=0;ft=0;}
for(let i=tracers.length-1;i>=0;i--){tracers[i].life-=dt;if(tracers[i].life<=0){scene.remove(tracers[i].mesh);tracers.splice(i,1);}else tracers[i].mesh.material.opacity=tracers[i].life*8;}
if(gameActive){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let wish=new THREE.Vector3();if(keys.w)wish.add(forward);if(keys.s)wish.sub(forward);if(keys.a)wish.sub(right);if(keys.d)wish.add(right);if(wish.lengthSq()>0)wish.normalize();
if(onGround){const cur=new THREE.Vector3(vx,0,vz);const speed=cur.dot(wish);const add=ACCEL*dt;if(speed<MOVE){const can=Math.min(MOVE-speed,add);vx+=wish.x*can*MOVE;vz+=wish.z*can*MOVE;}const sp=Math.hypot(vx,vz);if(sp>0.01){const drop=Math.max(0,1-FRICTION*dt);vx*=drop;vz*=drop;}else{vx=vz=0;}if(keys.space){vy=JUMP_V;onGround=false;}}else{vx+=wish.x*AIR_ACCEL*dt;vz+=wish.z*AIR_ACCEL*dt;const sp=Math.hypot(vx,vz);if(sp>MOVE*1.35){vx*=(MOVE*1.35)/sp;vz*=(MOVE*1.35)/sp;}}
vy-=GRAVITY*dt;px+=vx*dt;py+=vy*dt;pz+=vz*dt;if(py<=1.7){py=1.7;vy=0;onGround=true;}spdEl.textContent=Math.hypot(vx,vz).toFixed(1)+' u/s';

if(mode==='tracking'){trackT+=dt;orb.position.set(Math.sin(trackT*0.85)*14,1.7+Math.sin(trackT*1.4)*1.0,-10+Math.cos(trackT*0.55)*8);}}else{const t=performance.now()*0.00015;camera.position.set(Math.sin(t)*18,5,Math.cos(t)*18);camera.lookAt(0,1.5,0);}
renderer.render(scene,camera);}animate();
